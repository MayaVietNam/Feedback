<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phản hồi dịch vụ WiFi - MAYA VIETNAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .star-rating {
      display: flex;
      flex-direction: row-reverse;
      justify-content: center;
      gap: 0.25rem;
    }
    .star-rating input[type="radio"] {
      display: none;
    }
    .star-rating label {
      font-size: 2.5rem;
      color: #d1d5db;
      cursor: pointer;
      transition: color 0.2s;
    }
    .star-rating label:hover,
    .star-rating label:hover ~ label,
    .star-rating input[type="radio"]:checked ~ label {
      color: #f59e0b;
    }
    .lang-btn {
      transition: all 0.2s;
    }
    .lang-btn.active {
      background-color: #2563eb;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans">
  <div class="max-w-2xl mx-auto mt-4 text-right pr-4">
    <div class="inline-flex rounded-md shadow-sm" role="group">
      <button type="button" id="lang-vi" class="lang-btn px-4 py-2 text-sm font-medium text-gray-900 bg-white border border-gray-200 rounded-l-lg hover:bg-gray-100">VI</button>
      <button type="button" id="lang-en" class="lang-btn px-4 py-2 text-sm font-medium text-gray-900 bg-white border-t border-b border-gray-200 hover:bg-gray-100">EN</button>
      <button type="button" id="lang-ja" class="lang-btn px-4 py-2 text-sm font-medium text-gray-900 bg-white border border-gray-200 rounded-r-md hover:bg-gray-100">JA</button>
    </div>
  </div>

  <div class="max-w-2xl mx-auto mt-6 bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-semibold text-center mb-4" data-i18n="form_title">Khảo sát mức độ hài lòng dịch vụ WiFi</h1>
    <form id="feedbackForm">
      <div class="mb-4">
        <label class="block text-gray-700 mb-1 font-medium" data-i18n="fullname_label">Họ và tên</label>
        <input type="text" name="fullname" class="w-full border border-gray-300 px-3 py-2 rounded-lg" required />
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 mb-1 font-medium" data-i18n="email_label">Email</label>
        <input type="email" name="email" class="w-full border border-gray-300 px-3 py-2 rounded-lg" required />
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 mb-1 font-medium" data-i18n="device_label">Thiết bị đã thuê</label>
        <select name="device" class="w-full border border-gray-300 px-3 py-2 rounded-lg" required>
          <option value="" disabled selected data-i18n="select_placeholder">-- Chọn thiết bị --</option>
          <option value="WiFi Nhật Bản">WiFi Nhật Bản</option>
          <option value="WiFi Hàn Quốc">WiFi Hàn Quốc</option>
          <option value="WiFi châu Á">WiFi châu Á</option>
          <option value="WiFi toàn cầu">WiFi toàn cầu</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2" data-i18n="rating_label">Đánh giá tổng thể</label>
        <div class="star-rating">
          <input type="radio" id="star5" name="rating" value="5" required /><label for="star5">&#9733;</label>
          <input type="radio" id="star4" name="rating" value="4" /><label for="star4">&#9733;</label>
          <input type="radio" id="star3" name="rating" value="3" /><label for="star3">&#9733;</label>
          <input type="radio" id="star2" name="rating" value="2" /><label for="star2">&#9733;</label>
          <input type="radio" id="star1" name="rating" value="1" /><label for="star1">&#9733;</label>
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-1" data-i18n="comment_label">Ý kiến đóng góp</label>
        <textarea name="comment" class="w-full border border-gray-300 px-3 py-2 rounded-lg" rows="4" placeholder="Bạn hài lòng hay chưa hài lòng điều gì?" required></textarea>
      </div>

      <div class="text-center pt-4">
        <button type="submit" id="submitButton" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 transition-colors font-semibold text-lg" data-i18n="submit_button">
          Gửi phản hồi
        </button>
      </div>
      <p id="status" class="text-center font-medium h-6 mt-2"></p>
    </form>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbylHCes-0UOFDJ6ZOu7-qYCE_5szKSNQ3AxaZXzpC2n7ghX5Y5sAXQjwI23PjKWBSw/exec'; // <-- thay YOUR_SCRIPT_ID bằng ID Google Script thực tế
    const form = document.getElementById('feedbackForm');
    const status = document.getElementById('status');

    const translations = {
      vi: {
        form_title: 'Khảo sát mức độ hài lòng dịch vụ WiFi',
        fullname_label: 'Họ và tên',
        email_label: 'Email',
        device_label: 'Thiết bị đã thuê',
        rating_label: 'Đánh giá tổng thể',
        comment_label: 'Ý kiến đóng góp',
        submit_button: 'Gửi phản hồi',
        select_placeholder: '-- Chọn thiết bị --',
        success: 'Cảm ơn bạn đã phản hồi!',
        error: 'Có lỗi xảy ra. Vui lòng thử lại.',
      },
      en: {
        form_title: 'WiFi Service Satisfaction Survey',
        fullname_label: 'Full Name',
        email_label: 'Email',
        device_label: 'Rented Device',
        rating_label: 'Overall Rating',
        comment_label: 'Your Feedback',
        submit_button: 'Submit Feedback',
        select_placeholder: '-- Select device --',
        success: 'Thank you for your feedback!',
        error: 'An error occurred. Please try again.',
      },
      ja: {
        form_title: 'WiFiサービス満足度アンケート',
        fullname_label: '氏名',
        email_label: 'メール',
        device_label: 'レンタル端末',
        rating_label: '総合評価',
        comment_label: 'ご意見・ご感想',
        submit_button: 'フィードバックを送信',
        select_placeholder: '-- デバイスを選択 --',
        success: 'ご回答ありがとうございました！',
        error: 'エラーが発生しました。再度お試しください。',
      },
    };

    let lang = 'vi';
    function setLanguage(selectedLang) {
      lang = selectedLang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) el.innerText = translations[lang][key];
      });
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`lang-${lang}`).classList.add('active');
    }

    document.getElementById('lang-vi').addEventListener('click', () => setLanguage('vi'));
    document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
    document.getElementById('lang-ja').addEventListener('click', () => setLanguage('ja'));

    form.addEventListener('submit', e => {
      e.preventDefault();
      status.innerText = '...';
      fetch(scriptURL, { method: 'POST', body: new FormData(form) })
        .then(() => {
          status.innerText = translations[lang].success;
          status.className = "text-center font-medium h-6 text-green-600 mt-2";
          form.reset();
        })
        .catch(() => {
          status.innerText = translations[lang].error;
          status.className = "text-center font-medium h-6 text-red-600 mt-2";
        });
    });

    setLanguage('vi');
  </script>
</body>
</html>
